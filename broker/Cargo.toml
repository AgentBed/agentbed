[package]
name = "agentbed-broker"
description = "The privileged half of the split: fixed narrow RPC over a Unix socket, re-checking every call against the agent manifest itself. The authorization authority."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "agentbed-broker"
path = "src/main.rs"

[dependencies]
agentbed-protocol = { workspace = true }
agentbed-schemas = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
libc = { workspace = true }
base64 = "0.22"

[dev-dependencies]
libc = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
