[package]
name = "agentbed-broker"
description = "The privileged half of the split: fixed narrow RPC over a Unix socket, re-checking every call against the agent manifest itself. The authorization authority."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "agentbed-broker"
path = "src/main.rs"

[dependencies]
agentbed-adapter-nix = { path = "../adapters/nix" }
agentbed-protocol = { workspace = true }
agentbed-schemas = { workspace = true }
agentbed-watchdogd = { path = "../watchdogd" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
libc = { workspace = true }
base64 = "0.22"
ulid = "1.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
agentbed-adapter-nix = { path = "../adapters/nix" }
libc = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
